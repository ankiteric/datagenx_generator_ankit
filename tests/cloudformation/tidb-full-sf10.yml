AWSTemplateFormatVersion: "2010-09-09"
Description: "EC2 host for full-size DataGenX TiDB TPC-H/TPC-DS SF runs."

Parameters:
  InstanceType:
    Type: String
    Default: m7i.2xlarge
    Description: EC2 instance type for DataGenX source generation and TiDB Cloud loading runs.
  VolumeSizeGiB:
    Type: Number
    Default: 160
    MinValue: 80
    Description: Root EBS volume size in GiB. The runner stores generated files only; TiDB data lives in TiDB Cloud.
  VpcCidr:
    Type: String
    Default: 10.80.0.0/16
  PublicSubnetCidr:
    Type: String
    Default: 10.80.1.0/24
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-a"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: DataGenXArtifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt ArtifactBucket.Arn
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/datagenx/*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Egress-only security group for SSM-managed DataGenX host.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-sg"

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSizeGiB
            DeleteOnTermination: true
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-runner"
        - Key: Project
          Value: datagenx-tidb-full-sf10
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          dnf update -y
          dnf install -y \
            awscli \
            bison \
            byacc \
            cmake \
            flex \
            gcc \
            gcc-c++ \
            git \
            jq \
            make \
            mariadb105 \
            perl \
            pkgconf-pkg-config \
            python3 \
            python3-pip \
            tar \
            unzip

          mkdir -p /opt/datagenx-run/config /opt/datagenx-run/results /opt/datagenx-run/work
          chown -R ec2-user:ec2-user /opt/datagenx-run

          cat > /opt/datagenx-run/config/tidb.toml <<'EOF'
          new_collations_enabled_on_first_bootstrap = true

          [tikv-client.async-commit]
          safe-window = 0
          allowed-clock-drift = 0
          EOF

          echo "DataGenX TiDB SF runner bootstrapped" > /opt/datagenx-run/BOOTSTRAPPED

Outputs:
  InstanceId:
    Description: EC2 instance id.
    Value: !Ref Instance
  PublicIp:
    Description: Public IP. Access is expected through SSM, not SSH.
    Value: !GetAtt Instance.PublicIp
  ArtifactBucket:
    Description: S3 bucket used for source/result artifacts.
    Value: !Ref ArtifactBucket
  WorkDir:
    Description: Remote working directory.
    Value: /opt/datagenx-run
